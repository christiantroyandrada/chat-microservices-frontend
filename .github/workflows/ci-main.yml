name: CI Pipeline [master]

on:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/chat-frontend

jobs:
  build-and-test:
    name: Build, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        # Pinned to specific commit SHA for supply-chain security
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '9.11.0'

      - name: Setup Node.js
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          # Cache the pnpm store — avoids re-downloading packages on every run.
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend deployment workflow
        run: node --test scripts/__tests__/deployment-workflow.test.mjs scripts/__tests__/security-workflow.test.mjs

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=low

      - name: Lint
        run: pnpm run lint

      - name: Verify generated API contracts
        run: pnpm run check:contracts

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Svelte check
        run: pnpm run check

      - name: Build
        run: |
          pnpm run prepare || true
          pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm run coverage:unit
        timeout-minutes: 15

      - name: Upload coverage artifact
        # Share coverage/lcov.info with the sonar job to avoid re-running tests there.
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Upload Sonar TypeScript config
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-tsconfig
          path: .svelte-kit/tsconfig.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: SonarCloud Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        # Use the lcov.info produced by build-and-test — no need to reinstall
        # deps, playwright, or re-run tests here. Saves ~6 min per main push.
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: coverage/

      - name: Download Sonar TypeScript config
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-tsconfig
          path: .svelte-kit/

      - name: Validate coverage file
        run: test -s coverage/lcov.info && test -s .svelte-kit/tsconfig.json

      - name: SonarCloud Scan
        # Pinned to specific commit SHA for supply-chain security
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.tests=tests,scripts/__tests__
            -Dsonar.test.inclusions=tests/**,scripts/__tests__/**
            -Dsonar.exclusions=tests/**,test/**,__mocks__/**,mocks/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Build and push Docker image to GHCR
  docker-build:
    name: Build & Push Docker Image
    needs: [build-and-test, sonar]
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      frontend_digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout
        # Pinned to specific commit SHA for supply-chain security
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        # Pinned to specific commit SHA for supply-chain security
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch secrets from Infisical
        # Pinned to specific commit SHA for supply-chain security
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISCAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISCAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISCAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /

      - name: Build frontend for security scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: chat-frontend:scan
          build-args: |
            BUILD_ENV=production
            PUBLIC_API_URL=https://chat.ctaprojects.xyz
            PUBLIC_WS_URL=https://chat.ctaprojects.xyz
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chat-frontend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln

      - name: Build and push frontend
        id: build-image
        run: |
          docker tag chat-frontend:scan "$IMAGE_FRONTEND:$GITHUB_SHA"
          docker tag chat-frontend:scan "$IMAGE_FRONTEND:latest"
          docker push "$IMAGE_FRONTEND:$GITHUB_SHA"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_FRONTEND:$GITHUB_SHA")"
          digest="${digest##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid frontend registry digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker push "$IMAGE_FRONTEND:latest"

  deploy:
    name: Deploy Frontend to VPS
    needs: docker-build
    permissions:
      contents: read
      packages: read
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    concurrency:
      group: production-frontend-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/chat-frontend@${{ needs.docker-build.outputs.frontend_digest }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          envs: GHCR_TOKEN,REPO_OWNER,IMAGE_REF
          script_path: scripts/deploy-frontend.sh
